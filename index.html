<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#251f39"><meta name="description" content="Fred helps you learn money skills and build better budgeting habits.">
<link rel="manifest" href="manifest.webmanifest"><link rel="icon" type="image/png" sizes="32x32" href="assets/icons/app-icon-32.png"><link rel="apple-touch-icon" sizes="180x180" href="assets/icons/app-icon-180.png"><link rel="stylesheet" href="styles.css"><title>Fred — Money made friendly</title></head>
<body><div class="app">
<header class="top"><div><div class="eyebrow">YOUR MONEY COMPANION</div><h1 id="greeting">Hey there! 👋</h1><p>Little steps, big money confidence.</p></div><button class="avatar" id="winterToggle" title="Toggle Winter Fred">❄️</button></header>
<main id="content" aria-live="polite"></main>
<nav class="bottom" aria-label="Main navigation">
<button data-tab="home" class="active"><span>⌂</span>Home</button><button data-tab="budget"><span>▥</span>Budget</button>
<button data-tab="add" class="add" aria-label="Add transaction"><span>＋</span></button>
<button data-tab="learn"><span>▣</span>Learn</button><button data-tab="bills"><span>▤</span>Bills</button></nav></div>
<dialog id="modal"><form id="entryForm" class="dialog"><div class="dialoghead"><h2>Add a transaction</h2><button type="button" id="closeModal">✕</button></div>
<label>Description<input id="entryName" maxlength="60" placeholder="e.g. Groceries" required></label>
<div class="two"><label>Amount (CHF)<input id="entryAmount" type="number" min="0.01" step="0.01" required></label><label>Type<select id="entryType"><option value="expense">Expense</option><option value="income">Income</option></select></label></div>
<label>Category<select id="entryCategory"><option>Food</option><option>Shopping</option><option>Transport</option><option>Leisure</option><option>Other</option><option>Salary</option></select></label>
<button class="primary" type="submit">Save transaction</button></form></dialog>
<script src="app.js"></script></body></html>
